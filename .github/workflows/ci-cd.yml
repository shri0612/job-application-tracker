permissions:
  contents: read

name: CI-CD Pipeline

on:
  push:
    branches: ["main"]

jobs:

  # ----------------------------------------------------
  # 1️⃣ CI JOB — Lint + Security Scan + Tests + SonarCloud
  # ----------------------------------------------------
  ci:
    name: Lint + Security + Tests + Sonar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pytest pytest-django pytest-cov

      - name: Run flake8
        run: flake8 . || true

      - name: Run bandit
        run: bandit -r . -x env,venv,migrations,.git || true

      - name: Run tests with coverage
        run: pytest --cov=. --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: |
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORG }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/env/**,**/venv/**,**/migrations/**,**/static/**,**/__pycache__/**
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.python.version=3.10


  # ----------------------------------------------------
  # 2️⃣ DEPLOY JOB
  # ----------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@334f9259f2f8eb3376d33fa4c684fff373f2c2a6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo ">>> Connected to EC2"
            cd /home/ubuntu/jobtracker

            echo ">>> Pulling updates"
            cd repo
            git fetch --all
            git reset --hard origin/main
            cd ..

            echo ">>> Virtual environment"
            if [ ! -d venv ]; then python3 -m venv venv; fi
            source venv/bin/activate

            echo ">>> Installing deps"
            pip install --upgrade pip
            pip install -r repo/requirements.txt

            echo ">>> Migrating"
            cd repo
            python3 manage.py migrate --noinput

            echo ">>> Collect static"
            python3 manage.py collectstatic --noinput

            echo ">>> Restarting Gunicorn"
            sudo systemctl restart gunicorn

            echo ">>> Deployment done!"


  # ----------------------------------------------------
  # 3️⃣ ZAP SECURITY SCAN — After Deployment
  # ----------------------------------------------------
  zap:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Prepare ZAP output dir
        run: |
          rm -rf zap-output
          mkdir -p zap-output
          chmod 755 zap-output

      - name: Run ZAP Baseline Scan
        env:
          TARGET_URL: ${{ secrets.APP_URL }}
        run: |
          docker run --rm \
          -v "$PWD:/zap/wrk:rw" \
          ghcr.io/zaproxy/zaproxy:stable \
          zap-baseline.py \
          -t "$TARGET_URL" \
          -m 5 \
          -T 5 \
          -I \
          -r zap-output/zap_report.html \
          -J zap-output/zap_report.json \
          -w zap-output/zap_warnings.md || echo "ZAP finished with warnings"

      - name: Upload ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: zap-output/*
